name: build

on:
  push:
    branches-ignore: [docs, guide-sync]   # docs branches: docs-preview.yml builds them
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        preset: [ReleaseWithInstall, Release]   # ReleaseWithInstall is what Kefir ships
    runs-on: ${{ matrix.os }}
    container: devkitpro/devkita64:20250728

    steps:
    - uses: actions/checkout@v3

    # fetch latest cmake
    - uses: lukka/get-cmake@v3.31.6

    # sysmodule/source/main.c uses the omm service, added to libnx after v4.12.0 (switchbrew/libnx#713, 2026-02-18):
    # build libnx from master, pinned. The local WSL toolchain carries the same master build.
    - name: Build libnx
      env:
        LIBNX_SHA: feebd026ca0f5dcc2119f46ad8e0d16ad3dd4973
      run: |
        wget -qO- https://github.com/switchbrew/libnx/archive/$LIBNX_SHA.tar.gz | tar zxf - -C /tmp
        cd /tmp/libnx-$LIBNX_SHA
        make -j$(nproc)
        make install

    - name: Install portlibs
      run: dkp-pacman -S --noconfirm --needed switch-libarchive

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }} --parallel $(nproc)

    - name: Deploy
      if: ${{ github.event_name != 'pull_request' && github.event.action != 'unassigned' }}
      uses: actions/upload-artifact@master
      with:
        name: kefir-hub-${{ matrix.preset }}
        path: build/${{ matrix.preset }}/kefir-hub.nro
