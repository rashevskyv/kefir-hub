name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        preset: [Release]
    runs-on: ${{ matrix.os }}
    container: devkitpro/devkita64:20250728

    steps:
    - uses: actions/checkout@v3

    # fetch latest cmake
    - uses: lukka/get-cmake@v3.31.6

    - name: Build libnx
      run: |
        wget -qO- https://github.com/switchbrew/libnx/archive/v4.10.0.tar.gz | tar zxf - -C /tmp
        cd /tmp/libnx-4.10.0
        make -j$(nproc)
        make install

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }} --parallel $(nproc)

    - name: Deploy
      if: ${{ github.event_name != 'pull_request' && github.event.action != 'unassigned' }}
      uses: actions/upload-artifact@master
      with:
        name: kefir-hub-${{ matrix.preset }}
        path: build/${{ matrix.preset }}/kefir-hub.nro
