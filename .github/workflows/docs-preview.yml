# GitHub Pages of this repository, https://hub.customfw.xyz/ (custom domain, set in the Pages settings):
#   /         Kefir Hub docs, English (docs/site of branch docs), /uk/ Ukrainian — indexed, published docs
#   /guide/   preview of the switch.customfw.xyz guide reworked for Kefir Hub (rashevskyv/switch, branch kefir-hub), noindex
# Runs on a push to branch docs or guide-sync, and by hand (Actions -> docs-preview -> Run workflow).
# A push to kefir-hub in rashevskyv/switch writes docs/site/guide.ref on branch guide-sync (hub-preview.yml there):
# GitHub Pages ignores a deployment whose commit SHA was deployed before (actions/deploy-pages#383), so a
# rebuild needs a new commit, and a dispatch or a manual run on an unchanged branch changes nothing online.
# Every page has an edit link to its file on those branches.
# The live guide site (switch, gh-pages) is not touched.
name: docs-preview

on:
  push:
    branches: [docs, guide-sync]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kefir Hub docs
        env:
          DOCS_EDIT_BRANCH: docs
          DOCS_REPO_URL: https://github.com/rashevskyv/kefir-hub
          DOCS_SITE_BASE: https://hub.customfw.xyz
        run: |
          pip install -r docs/site/requirements.txt
          sh docs/site/build.sh
          printf 'User-agent: *\nAllow: /\n\nSitemap: https://hub.customfw.xyz/sitemap.xml\nSitemap: https://hub.customfw.xyz/uk/sitemap.xml\n' > build/docs-site/robots.txt

      - uses: actions/checkout@v4
        with:
          repository: rashevskyv/switch
          ref: kefir-hub
          path: guide-src

      # Jekyll 4.2 / Liquid 4.0.3 break on Ruby 3.2+ (String#tainted? removed).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Guide
        working-directory: guide-src
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install
          bundle exec jekyll build --config _config.yml,_rework/_config.ghpreview.yml -d ../build/docs-site/guide
          # the guide's pages and screenshots link from the site root ("/hbl", "/assets/..."), right on
          # switch.customfw.xyz; under /guide/ they must carry the subpath.
          find ../build/docs-site/guide -name '*.html' -exec perl -pi -e 's#(href|src)="/(?!/|guide/)#$1="/guide/#g' {} +

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
